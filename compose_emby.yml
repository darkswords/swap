services:
  emby:
    #image: amilys/embyserver_arm64v8:latest
    #image: amilys/embyserver:latest
    #image: emby/embyserver_arm64v8:latest
    image: emby/embyserver:latest 
    container_name: emby
    network_mode: host
    #networks:
    #  share:
    #    ipv4_address: 172.16.2.3
    ports:
      - 8096:8096  #http
    #  - 8920:8920  #https
    volumes:
      - ./config:/config
      - /root/public_data/embyserver/cache:/config/cache
      - /root/pulbic_data/embyserver/metadata:/config/metadata
      - /root/pulbic_data/strm:/strm  
      - ./transcode:/transcode  
    environment:
      - UID=0
      - GID=0
      - GIDLIST=0
    devices:
      - /dev/dri:/dev/dri
    restart: always
