services:
  openlist:
    image: 'openlistteam/openlist:latest'
    container_name: openlist
    network_mode: bridge
    restart: always
    volumes:
      - './data:/opt/openlist/data'
    ports:
      - '5244:5244'
    # - '5245:5245'
    environment:
      - PUID=0
      - PGID=0
      - UMASK=022
      - TZ=Asia/Shanghai
    
    
